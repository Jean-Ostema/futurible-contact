<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#9dc3f8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Futurible">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Futurible Contact</title>
<style>
  :root { --azul: #0a4ea3; --fondo: #9dc3f8; --claro: #eef6ff; --cian: #3ec8d6; --gris: #5b6b82; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--fondo); color: var(--azul); min-height: 100vh; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 16px 14px 40px; }
  header { text-align: center; }
  header img { width: 180px; max-width: 60%; height: auto; }
  h1 { font-size: 1.15rem; margin: 4px 0 14px; letter-spacing: .5px; text-align: center; }
  h2 { font-size: 1rem; margin: 0 0 10px; }
  .card { background: var(--claro); border-radius: 18px; padding: 16px; box-shadow: 0 6px 18px rgba(10,78,163,.18); margin-bottom: 14px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
  .tabs button { flex: 1; margin: 0; background: #fff; color: var(--azul); border: 1.5px solid var(--azul); padding: 11px; border-radius: 12px; font-weight: 700; cursor: pointer; font-size: .95rem; }
  .tabs button.activa { background: var(--azul); color: #fff; }
  label { display: block; font-size: .85rem; font-weight: 600; margin: 12px 0 4px; }
  label span.req { color: #c0392b; }
  input, textarea { width: 100%; padding: 11px 12px; font-size: 16px; border: 1.5px solid #b8d4f5; border-radius: 10px; background: #fff; color: #1b2b44; font-family: inherit; }
  input:focus, textarea:focus { outline: none; border-color: var(--cian); box-shadow: 0 0 0 3px rgba(62,200,214,.25); }
  textarea { min-height: 70px; resize: vertical; }
  button.principal { width: 100%; margin-top: 16px; padding: 14px; font-size: 1rem; font-weight: 700; border: none; border-radius: 12px; background: var(--azul); color: #fff; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  .msg { margin-top: 14px; padding: 12px; border-radius: 10px; text-align: center; font-weight: 600; display: none; }
  .msg.ok { display: block; background: #d7f5e3; color: #17663a; }
  .msg.error { display: block; background: #fbdcdc; color: #8b1e1e; }
  .oculto { display: none !important; }
  .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .kpi { background: #fff; border-radius: 14px; padding: 14px; text-align: center; }
  .kpi b { display: block; font-size: 1.6rem; }
  .kpi span { font-size: .8rem; color: var(--gris); }
  .barra { margin: 8px 0; }
  .barra .txt { display: flex; justify-content: space-between; font-size: .88rem; }
  .barra .pista { background: #fff; border-radius: 8px; height: 10px; overflow: hidden; margin-top: 4px; }
  .barra .relleno { height: 100%; background: linear-gradient(90deg, var(--cian), var(--azul)); border-radius: 8px; }
  .contacto { background: #fff; border-radius: 12px; padding: 12px; margin-bottom: 8px; }
  .contacto b { font-size: .98rem; }
  .contacto .dato { font-size: .88rem; color: var(--gris); margin-top: 3px; }
  .contacto a { color: var(--azul); }
  .acciones { display: flex; gap: 8px; margin-top: 4px; font-size: .88rem; }
  .vacio { text-align: center; color: var(--gris); padding: 18px; }
  .pie { text-align: center; font-size: .8rem; margin-top: 10px; opacity: .8; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="logo.png" alt="Futurible - Futuro Posible">
  </header>

  <div id="panelClave" class="card oculto">
    <h1>Primera vez</h1>
    <label for="clave">Clave de acceso</label>
    <input id="clave" type="password" autocomplete="off">
    <button id="guardarClave" class="principal" type="button">Entrar</button>
    <div id="msgClave" class="msg"></div>
  </div>

  <div id="app" class="oculto">
    <div class="tabs">
      <button id="tabRegistrar" class="activa" type="button">Registrar</button>
      <button id="tabPanel" type="button">Panel</button>
    </div>

    <div id="vistaRegistrar" class="card">
      <h1>Registrar contacto</h1>
      <form id="f" autocomplete="off">
        <label for="nombre">Nombre completo <span class="req">*</span></label>
        <input id="nombre" name="nombre" required>
        <label for="cargo">Cargo</label>
        <input id="cargo" name="cargo">
        <label for="empresa">Empresa u organización</label>
        <input id="empresa" name="empresa">
        <label for="correo">Correo</label>
        <input id="correo" name="correo" type="email" inputmode="email">
        <label for="telefono">Teléfono</label>
        <input id="telefono" name="telefono" type="tel" inputmode="tel">
        <label for="ciudad">Ciudad o país</label>
        <input id="ciudad" name="ciudad">
        <label for="area">Área o rubro</label>
        <input id="area" name="area" placeholder="Ej: educación, emprendimiento">
        <label for="como">Cómo nos conocimos</label>
        <input id="como" name="como">
        <label for="notas">Notas</label>
        <textarea id="notas" name="notas"></textarea>
        <button id="btn" class="principal" type="submit">Guardar contacto</button>
        <div id="msg" class="msg"></div>
      </form>
    </div>

    <div id="vistaPanel" class="oculto">
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <h2 style="margin:0">Resumen</h2>
          <button id="actualizar" type="button" style="width:auto;margin:0;padding:8px 14px;font-size:.85rem;">Actualizar</button>
        </div>
        <div id="kpis" class="kpis" style="margin-top:12px"></div>
        <div id="msgPanel" class="msg"></div>
      </div>

      <div class="card"><h2>Por ciudad o país</h2><div id="gCiudad"></div></div>
      <div class="card"><h2>Por cargo</h2><div id="gCargo"></div></div>
      <div class="card"><h2>Por área o rubro</h2><div id="gArea"></div></div>
      <div class="card"><h2>Por empresa u organización</h2><div id="gEmpresa"></div></div>
      <div class="card"><h2>Cómo nos conocimos</h2><div id="gComo"></div></div>
      <div class="card"><h2>Contactos agregados por día</h2><div id="gDia"></div></div>

      <div class="card">
        <h2>Buscar contacto</h2>
        <input id="buscar" type="search" placeholder="Nombre, cargo, empresa, ciudad...">
        <div id="lista" style="margin-top:12px"></div>
      </div>
    </div>

    <p class="pie">Los datos vienen de la hoja "Futurible Contactos" de tu Drive.</p>
  </div>
</div>

<script>
  const API_URL = 'https://script.google.com/macros/s/AKfycbzNuje5GxyE_GnHgFr4Ygsxzmm_Jz85zR_bCKaC0qMeDkvZz0v37tldVcWx0W1o1uaV/exec';
  const CLAVE_KEY = 'futurible-clave';
  const DATOS_KEY = 'futurible-datos';

  const $ = (id) => document.getElementById(id);
  let contactos = [];

  function mostrar(el, texto, tipo) { el.textContent = texto; el.className = 'msg ' + tipo; }
  function esc(s) { return String(s || '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function enviar(cuerpo) {
    return fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ clave: localStorage.getItem(CLAVE_KEY) }, cuerpo))
    }).then((r) => r.json());
  }

  function mostrarPantalla() {
    const tieneClave = !!localStorage.getItem(CLAVE_KEY);
    $('panelClave').classList.toggle('oculto', tieneClave);
    $('app').classList.toggle('oculto', !tieneClave);
    if (tieneClave) { cargarDatosGuardados(); }
  }

  function cambiarVista(vista) {
    const reg = vista === 'registrar';
    $('tabRegistrar').classList.toggle('activa', reg);
    $('tabPanel').classList.toggle('activa', !reg);
    $('vistaRegistrar').classList.toggle('oculto', !reg);
    $('vistaPanel').classList.toggle('oculto', reg);
    if (!reg) { cargarPanel(); }
  }

  $('guardarClave').addEventListener('click', function () {
    const v = $('clave').value.trim();
    if (!v) { mostrar($('msgClave'), 'Escribe la clave.', 'error'); return; }
    localStorage.setItem(CLAVE_KEY, v);
    $('clave').value = '';
    mostrarPantalla();
  });

  $('tabRegistrar').addEventListener('click', () => cambiarVista('registrar'));
  $('tabPanel').addEventListener('click', () => cambiarVista('panel'));
  $('actualizar').addEventListener('click', cargarPanel);

  $('f').addEventListener('submit', async function (e) {
    e.preventDefault();
    const btn = $('btn');
    const datos = {};
    new FormData($('f')).forEach(function (v, k) { datos[k] = String(v).trim(); });
    if (!datos.nombre) { mostrar($('msg'), 'Escribe al menos el nombre.', 'error'); return; }
    btn.disabled = true; btn.textContent = 'Guardando...'; $('msg').className = 'msg';
    try {
      const res = await enviar({ contacto: datos });
      if (res.ok) {
        mostrar($('msg'), 'Contacto guardado. ¡Listo!', 'ok');
        $('f').reset(); $('nombre').focus();
        contactos.push(Object.assign({ fecha: new Date().toISOString() }, datos));
        localStorage.setItem(DATOS_KEY, JSON.stringify(contactos));
      } else if (res.error === 'clave') {
        mostrar($('msg'), 'Clave incorrecta. Usa "Cambiar clave" y vuelve a intentarlo.', 'error');
      } else {
        mostrar($('msg'), 'No se pudo guardar: ' + (res.error || 'error desconocido'), 'error');
      }
    } catch (err) {
      mostrar($('msg'), 'Sin conexión. Intenta de nuevo con internet.', 'error');
    } finally {
      btn.disabled = false; btn.textContent = 'Guardar contacto';
    }
  });

  function cargarDatosGuardados() {
    try { contactos = JSON.parse(localStorage.getItem(DATOS_KEY) || '[]'); } catch (e) { contactos = []; }
    pintarPanel();
  }

  async function cargarPanel() {
    const msg = $('msgPanel');
    mostrar(msg, 'Cargando contactos...', 'ok');
    try {
      const res = await enviar({ accion: 'listar' });
      if (!res.ok) {
        mostrar(msg, res.error === 'clave' ? 'Clave incorrecta. Usa "Cambiar clave".' : 'No se pudo cargar: ' + res.error, 'error');
        return;
      }
      contactos = res.contactos || [];
      localStorage.setItem(DATOS_KEY, JSON.stringify(contactos));
      msg.className = 'msg';
      pintarPanel();
    } catch (err) {
      mostrar(msg, 'Sin conexión. Mostrando los últimos datos guardados.', 'error');
      cargarDatosGuardados();
    }
  }

  function norm(v) { return String(v || '').trim(); }
  function agrupar(lista, campo) {
    const mapa = {};
    lista.forEach((c) => {
      const original = norm(c[campo]);
      const k = original ? original.toLowerCase() : '__vacio__';
      if (!mapa[k]) mapa[k] = { nombre: original || 'Sin dato', n: 0 };
      mapa[k].n++;
    });
    return Object.values(mapa).sort((a, b) => b.n - a.n);
  }

  function barras(elId, lista, campo, limite) {
    const grupos = agrupar(lista, campo).slice(0, limite || 8);
    const el = $(elId);
    if (!grupos.length) { el.innerHTML = '<div class="vacio">Sin datos todavía</div>'; return; }
    const max = grupos[0].n;
    el.innerHTML = grupos.map((g) =>
      '<div class="barra"><div class="txt"><span>' + esc(g.nombre) + '</span><b>' + g.n + '</b></div>' +
      '<div class="pista"><div class="relleno" style="width:' + Math.round(g.n / max * 100) + '%"></div></div></div>'
    ).join('');
  }

  function porDia(lista) {
    const dias = {};
    lista.forEach((c) => {
      const f = new Date(c.fecha);
      if (isNaN(f)) return;
      const k = f.toISOString().slice(0, 10);
      dias[k] = (dias[k] || 0) + 1;
    });
    return Object.keys(dias).sort().slice(-14).map((k) => ({ nombre: k.split('-').reverse().join('/'), n: dias[k] }));
  }

  function pintarPanel() {
    const total = contactos.length;
    const cuenta = (campo) => agrupar(contactos, campo).filter((g) => g.nombre !== 'Sin dato').length;
    $('kpis').innerHTML =
      '<div class="kpi"><b>' + total + '</b><span>contactos</span></div>' +
      '<div class="kpi"><b>' + cuenta('ciudad') + '</b><span>ciudades o países</span></div>' +
      '<div class="kpi"><b>' + cuenta('empresa') + '</b><span>empresas</span></div>' +
      '<div class="kpi"><b>' + cuenta('area') + '</b><span>áreas o rubros</span></div>';

    barras('gCiudad', contactos, 'ciudad');
    barras('gCargo', contactos, 'cargo');
    barras('gArea', contactos, 'area');
    barras('gEmpresa', contactos, 'empresa');
    barras('gComo', contactos, 'como');

    const dias = porDia(contactos);
    if (!dias.length) { $('gDia').innerHTML = '<div class="vacio">Sin datos todavía</div>'; }
    else {
      const max = Math.max.apply(null, dias.map((d) => d.n));
      $('gDia').innerHTML = dias.map((d) =>
        '<div class="barra"><div class="txt"><span>' + d.nombre + '</span><b>' + d.n + '</b></div>' +
        '<div class="pista"><div class="relleno" style="width:' + Math.round(d.n / max * 100) + '%"></div></div></div>'
      ).join('');
    }
    filtrarLista();
  }

  function filtrarLista() {
    const q = norm($('buscar').value).toLowerCase();
    const lista = contactos.filter((c) => !q || Object.values(c).join(' ').toLowerCase().indexOf(q) !== -1);
    if (!lista.length) { $('lista').innerHTML = '<div class="vacio">' + (contactos.length ? 'Sin resultados' : 'Aún no hay contactos') + '</div>'; return; }
    $('lista').innerHTML = lista.slice().reverse().map((c) => {
      const tel = norm(c.telefono).replace(/s/g, '');
      const mail = norm(c.correo);
      return '<div class="contacto"><b>' + esc(c.nombre) + '</b>' +
        (c.cargo ? '<div class="dato">' + esc(c.cargo) + '</div>' : '') +
        (c.empresa ? '<div class="dato">' + esc(c.empresa) + '</div>' : '') +
        (c.ciudad ? '<div class="dato">📍 ' + esc(c.ciudad) + '</div>' : '') +
        (c.area ? '<div class="dato">Área: ' + esc(c.area) + '</div>' : '') +
        (c.como ? '<div class="dato">Nos conocimos: ' + esc(c.como) + '</div>' : '') +
        (c.notas ? '<div class="dato">Notas: ' + esc(c.notas) + '</div>' : '') +
        '<div class="acciones">' +
        (tel ? '<a href="tel:' + esc(tel) + '">Llamar</a>' : '') +
        (mail ? '<a href="mailto:' + esc(mail) + '">Correo</a>' : '') +
        '</div></div>';
    }).join('');
  }

  $('buscar').addEventListener('input', filtrarLista);

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js'); });
  }

  mostrarPantalla();
</script>
</body>
</html>
